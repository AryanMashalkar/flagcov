name: Release to PyPI

# Publishes with PyPI trusted publishing (no API token stored in GitHub).
# One-time setup on pypi.org: add a "pending publisher" for project "flagcov",
# this repository, workflow "release.yml", environment "pypi".

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
